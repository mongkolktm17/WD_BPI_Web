<!DOCTYPE html>
<html>

<head>
    <title>Debug POST to cctv_report.php</title>
</head>

<body>
    <h2>Test POST to cctv_report.php</h2>
    <p>This will send a sample report payload to cctv_report.php.</p>
    <button onclick="sendTestPost()">Send Test POST</button>
    <div id="result"></div>
    <div id="log"></div>

    <script>
        async function sendTestPost() {
            const data = {
                action: 'save_report',
                building: 'B.2',
                stats: {
                    total: 10,
                    online: 5,
                    offline: 5,
                    percentage: 50.0,
                    nvrStats: {
                        'NVR-1': { online_channels: 5, total_channels: 10 }
                    },
                    fullChannelStatusByNVR: {
                        'NVR-1': { 1: true, 2: false }
                    }
                }
            };

            document.getElementById('log').innerHTML += "Sending...<br>";

            try {
                const response = await fetch('cctv_report.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const text = await response.text();
                document.getElementById('log').innerHTML += "Response Status: " + response.status + "<br>";
                document.getElementById('result').innerText = text;
                console.log(text);

                try {
                    const json = JSON.parse(text);
                    document.getElementById('log').innerHTML += "JSON Status: " + json.status + "<br>";
                } catch (e) {
                    document.getElementById('log').innerHTML += "Invalid JSON response<br>";
                }

            } catch (e) {
                document.getElementById('log').innerHTML += "Error: " + e.message + "<br>";
            }
        }
    </script>
</body>

</html>
