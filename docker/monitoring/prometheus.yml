# Prometheus scrape config for WDBPI.
# The API exposes Prometheus metrics at http://api:4000/api/metrics
# (set METRICS_TOKEN env on the api service AND bearer_token below to match).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'wdbpi-api'
    metrics_path: /api/metrics
    static_configs:
      - targets: ['api:4000']
    # Uncomment when METRICS_TOKEN is set on the API:
    # authorization:
    #   credentials: '${METRICS_TOKEN}'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
