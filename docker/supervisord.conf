[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/run/supervisord.pid

[program:api]
command=node apps/api/dist/main
directory=/app
autostart=true
autorestart=true
environment=NODE_ENV="production",PORT="4000",DATABASE_URL="${DATABASE_URL}",REDIS_URL="${REDIS_URL}",JWT_SECRET="${JWT_SECRET}",TZ="Asia/Bangkok"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=node apps/web/server.js
directory=/app
autostart=true
autorestart=true
environment=NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0",NEXT_PUBLIC_API_URL="/api",TZ="Asia/Bangkok"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
