upstream web_upstream {
    server web:3000;
}

upstream api_upstream {
    server api:4000;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ============================================================
    # Static Assets & CCTV Images (Directly served from volume)
    # ============================================================
    location /cctv-images/ {
        alias /app/report_assets/Images/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /report_assets/ {
        alias /app/report_assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ============================================================
    # API Proxy (New System)
    # ============================================================
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api_upstream/api/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # ============================================================
    # ============================================================
    # Static Next.js assets with long-term caching
    # ============================================================
    location /_next/static/ {
        proxy_pass http://web_upstream/_next/static/;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }

    # ============================================================
    # Inter font fallback for legacy / CRA / PWA asset requests
    # ============================================================
    location ~* inter-variable-latin\.woff2$ {
        rewrite ^.*$ /inter-variable-latin.woff2 break;
        proxy_pass http://web_upstream;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # ============================================================
    # Service Worker cleanup / unregister for localhost
    # ============================================================
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        return 200 "self.addEventListener('install', () => self.skipWaiting()); self.addEventListener('activate', (e) => e.waitUntil(caches.keys().then((k) => Promise.all(k.map((c) => caches.delete(c)))).then(() => self.registration.unregister()).then(() => self.clients.matchAll()).then((clients) => clients.forEach((c) => { if ('navigate' in c) c.navigate(c.url); }))));\n";
    }

    # ============================================================
    # Chrome Devtools internal probe
    # ============================================================
    location /.well-known/appspecific/ {
        default_type application/json;
        return 200 "{}";
    }

    # ============================================================
    # Next.js Web (default)
    # ============================================================
    location / {
        limit_req zone=web_limit burst=50 nodelay;

        proxy_pass http://web_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
