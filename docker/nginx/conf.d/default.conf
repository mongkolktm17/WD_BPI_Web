upstream web_upstream {
    server web:3000;
}

upstream api_upstream {
    server api:4000;
}

upstream legacy_upstream {
    server legacy:80;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ============================================================
    # Static Assets & CCTV Images (Directly served from volume)
    # ============================================================
    location /cctv-images/ {
        alias /app/report_assets/Images/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location /report_assets/ {
        alias /app/report_assets/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ============================================================
    # API Proxy (New System)
    # ============================================================
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api_upstream/api/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # ============================================================
    # Legacy PHP System (accessed via /legacy/)
    # ============================================================
    location /legacy/ {
        proxy_pass http://legacy_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ============================================================
    # Static Next.js assets with long-term caching
    # ============================================================
    location /_next/static/ {
        proxy_pass http://web_upstream/_next/static/;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }

    # ============================================================
    # Next.js Web (default)
    # ============================================================
    location / {
        limit_req zone=web_limit burst=50 nodelay;

        proxy_pass http://web_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
