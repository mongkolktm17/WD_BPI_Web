# HTTP-only bootstrap config (no cert yet).
# Rendered with $DOMAIN by docker/nginx/entrypoint.sh.
# Purpose: serve ACME challenge + proxy app over plain HTTP until the first
# `certbot certonly --webroot` succeeds. After that, restart nginx to pick up
# the full HTTPS config.
upstream web_upstream {
    server web:3000;
}

upstream api_upstream {
    server api:4000;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=30r/s;

server {
    listen 80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API Proxy
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Legacy PHP URL Redirects
    location ~ ^/(dashboard|cctv_report|car_parking|guard_duty_log|nvr_recording_days|check_hand_held|walkthrough_metal_detector)\.php$ {
        return 301 /$1;
    }

    location = /index.php {
        return 301 /;
    }

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://web_upstream/_next/static/;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js Web Proxy
    location / {
        limit_req zone=web_limit burst=50 nodelay;

        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
