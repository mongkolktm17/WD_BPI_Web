listen_addresses = '*'
max_connections = 100
shared_buffers = 128MB
effective_cache_size = 384MB
maintenance_work_mem = 64MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
work_mem = 8MB
huge_pages = off
min_wal_size = 512MB
max_wal_size = 2GB
wal_level = replica
max_wal_senders = 3
hot_standby = on
log_autovacuum_min_duration = 1000
log_statement = 'ddl'
log_duration = off
# WAL archiving for PITR (archive dir lives on the postgres data volume;
# copy it offsite alongside pg_dump backups - see docs/prod-runbook.md)
archive_mode = on
archive_command = 'mkdir -p /var/lib/postgresql/archive && test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
fsync = on
synchronous_commit = on
full_page_writes = on
archive_timeout = 0
max_parallel_workers_per_gather = 2
max_parallel_workers = 4