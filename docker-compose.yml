name: wdbpi-app

services:
  # ============================================================
  # NEW SYSTEM (Node.js + Next.js + PostgreSQL)
  # ============================================================
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: production
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=/api
      - API_INTERNAL_URL=http://api:4000
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-wdbpi_super_secret_jwt_key_2026}
      - TZ=Asia/Bangkok
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    volumes:
      - report_assets:/app/report_assets:ro

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: production
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:-postgresql://wdbpi_user:wdbpi_pass@postgres:5432/wdbpi_db?schema=public}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-wdbpi_super_secret_jwt_key_2026}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost}
      - TZ=Asia/Bangkok
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    volumes:
      - report_assets:/app/report_assets:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:18-alpine
    container_name: wdbpi_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: wdbpi_db
      POSTGRES_USER: wdbpi_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wdbpi_pass}
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/postgresql.conf:/etc/postgresql/18/main/postgresql.conf
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    command: postgres -c config_file=/etc/postgresql/18/main/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wdbpi_user -d wdbpi_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  redis:
    image: redis:8-alpine
    container_name: wdbpi_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # ============================================================
  # LEGACY SYSTEM (PHP + MySQL)
  # ============================================================
  legacy:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
      target: production
    restart: unless-stopped
    environment:
      - DB_SERVER=mysql
      - DB_USERNAME=${MYSQL_USER:-wdbpi_legacy}
      - DB_PASSWORD=${MYSQL_PASSWORD:-wdbpi_legacy_pass}
      - DB_NAME=${MYSQL_DATABASE:-wdbpi_legacy}
      - TZ=Asia/Bangkok
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    volumes:
      - ./legacy:/var/www/html
      - ./docker/php/config.docker.php:/var/www/html/config.php:ro
      - ./apps/web/public/report_assets:/var/www/html/report_assets:ro

  mysql:
    image: mysql:8.4
    container_name: wdbpi_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wdbpi_legacy}
      MYSQL_USER: ${MYSQL_USER:-wdbpi_legacy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wdbpi_legacy_pass}
      TZ: Asia/Bangkok
    volumes:
      - mysql_data:/var/lib/mysql
      - ./legacy/src/wddump.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-connections=100
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ============================================================
  # NGINX REVERSE PROXY (routes both systems)
  # ============================================================
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - report_assets:/app/report_assets:ro
    depends_on:
      - web
      - api
      - legacy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

volumes:
  postgres_data:
  redis_data:
  mysql_data:
  report_assets:
