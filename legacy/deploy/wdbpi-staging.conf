# Staging vhost for staging.wdbpi.pcsiot.com
#
# Install to: /etc/nginx/conf.d/wdbpi-staging.conf
#
# Derived from wdbpi.conf so the two stay in step: same denied maintenance
# scripts, same dotfile and dump blocking, same PHP handling. Differences:
#   - root is /var/www/wdbpi-staging
#   - its own Let's Encrypt certificate
#   - HTTP Basic auth + noindex, so staging is not publicly browsable
#   - no default_server blocks; production's wdbpi.conf owns the catch-all
#
server {
    listen 80;
    listen [::]:80;
    server_name staging.wdbpi.pcsiot.com;

    root /var/www/wdbpi-staging;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.wdbpi.pcsiot.com;

    root /var/www/wdbpi-staging;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/staging.wdbpi.pcsiot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.wdbpi.pcsiot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Staging is not for public eyes. The app's own login still applies behind this.
    auth_basic           "wdbpi staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;

    access_log /var/log/nginx/wdbpi-staging_access.log;
    error_log  /var/log/nginx/wdbpi-staging_error.log;

    client_max_body_size 10M;

    # ── Hidden files. Also covers the .ssh/.bash_history/.mysql_history/.gnupg
    #    that currently sit inside the webroot. Keep this first.
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Maintenance, migration and one-off admin scripts.
    #    None of these have an auth gate; most connect with real DB creds.
    #
    #    NOT denied, because they are legitimate admin pages that already gate
    #    on check_permissions.php and are in active use:
    #      import_officers.php, sync_officers_from_csv.php, import_camera_names.php
    #    save_cctv_report.php is likewise a live endpoint and stays reachable.
    location ~* ^/(reset|reset_admin_password|reset_officers|setup|run_migration|add_soft_delete_columns|optimize_database|update_parking_db|update_usernames|update_csv_usernames|update_b9_slots_production|cleanup_files|get_schema|test_stats|test_stats_v2|compare_parking|dashboard_new|performance_config)\.php$ {
        deny all;
        return 404;
    }

    # ── Catch the shape of future one-off scripts, not just today's names.
    location ~* ^/(setup|install|migrate|migration|seed|reset|debug|test|tmp|backup|dump|admin_tool|fix|patch|update_db|db_)[a-z0-9_-]*\.php$ {
        deny all;
        return 404;
    }

    location ~ /config\.php$ {
        deny all;
        return 404;
    }

    location ~ ^/logs/ {
        deny all;
        return 404;
    }

    location ~ \.(bak|config|sql|log|txt|md|sh|swp|ini|yml|yaml|json|lock)$ {
        deny all;
        return 404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
}
