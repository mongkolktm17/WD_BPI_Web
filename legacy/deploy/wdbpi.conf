# Hardened nginx config for wdbpi.pcsiot.com
#
# Install to: /etc/nginx/conf.d/wdbpi.conf
#
# This replaces the sites-available/sites-enabled symlink pair. That layout is
# a Debian/Ubuntu convention inherited from Apache's a2ensite; upstream nginx
# (nginx.org packages, RHEL, Alpine, the official Docker image) ships only
# conf.d. Since this host is heading for a containerised CI/CD deploy, conf.d
# is the portable choice. /etc/nginx/nginx.conf on this box already includes
# conf.d/*.conf (line 59), so no nginx.conf change is needed.
#
# DEFAULT SERVER: the stock `default` site is removed (quarantined by
# harden-production.sh), and this file declares the catch-all explicitly below
# rather than letting nginx pick the first-loaded block implicitly. Unmatched
# Host headers and bare-IP requests get nothing instead of being served this
# site. The access logs show constant probe traffic (phpunit eval-stdin,
# geoserver, /.git/config), so this is worth doing.
#
# Changes vs the config currently on the VPS:
#   1. Maintenance/admin scripts are denied at the web layer. The live config
#      passes every *.php to PHP-FPM with no allowlist, which is how a scanner
#      reached /setup.php and got HTTP 200 on 21 Jan 2026.
#   2. Blocks the whole class, not just today's filenames, so a future
#      one-off script dropped into the webroot is not instantly public.
#   3. HSTS enabled.
#
# Deleting those scripts from the webroot is the real fix; this is the
# defence-in-depth layer that keeps the next one from being reachable.

# ── Catch-all: anything that is not one of our hostnames ─────────────────
# 444 is nginx's "close the connection without a response".
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# For TLS, reject at handshake time so we do not have to present a cert for a
# name we do not serve. Requires nginx >= 1.19.4 (this host runs 1.24.0).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name wdbpi.pcsiot.com www.wdbpi.pcsiot.com;

    root /var/www/wdbpi;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wdbpi.pcsiot.com www.wdbpi.pcsiot.com;

    root /var/www/wdbpi;
    index index.php index.html;

    ssl_certificate /etc/letsencrypt/live/wdbpi.pcsiot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wdbpi.pcsiot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/wdbpi_access.log;
    error_log  /var/log/nginx/wdbpi_error.log;

    client_max_body_size 10M;

    # ── Hidden files. Also covers the .ssh/.bash_history/.mysql_history/.gnupg
    #    that currently sit inside the webroot. Keep this first.
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Maintenance, migration and one-off admin scripts.
    #    None of these have an auth gate; most connect with real DB creds.
    #
    #    NOT denied, because they are legitimate admin pages that already gate
    #    on check_permissions.php and are in active use:
    #      import_officers.php, sync_officers_from_csv.php, import_camera_names.php
    #    save_cctv_report.php is likewise a live endpoint and stays reachable.
    location ~* ^/(reset|reset_admin_password|reset_officers|setup|run_migration|add_soft_delete_columns|optimize_database|update_parking_db|update_usernames|update_csv_usernames|update_b9_slots_production|cleanup_files|get_schema|test_stats|test_stats_v2|compare_parking|dashboard_new|performance_config)\.php$ {
        deny all;
        return 404;
    }

    # ── Catch the shape of future one-off scripts, not just today's names.
    location ~* ^/(setup|install|migrate|migration|seed|reset|debug|test|tmp|backup|dump|admin_tool|fix|patch|update_db|db_)[a-z0-9_-]*\.php$ {
        deny all;
        return 404;
    }

    location ~ /config\.php$ {
        deny all;
        return 404;
    }

    location ~ ^/logs/ {
        deny all;
        return 404;
    }

    location ~ \.(bak|config|sql|log|txt|md|sh|swp|ini|yml|yaml|json|lock)$ {
        deny all;
        return 404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php7.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
}
